<!DOCTYPE html><html><head><meta charset="utf-8"><title>Daaymn</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>
// A refresh or direct link on a demo screen (/Daaymn/demo/chat) has no file behind it:
// keep the screen's address for the demo's index.html, then open the demo, never a 404.
if (location.pathname.indexOf('/Daaymn/demo/') === 0) {
  try { sessionStorage.setItem('daaymn-demo-path', location.pathname + location.search + location.hash); } catch (e) {}
  location.replace('/Daaymn/demo/');
}
</script></head>
<body style="background:#121212;color:#fff;font:16px sans-serif;padding:32px">
<p>That page isn't here. <a style="color:#FC00FF" href="/Daaymn/">Go to the Daaymn home page</a>.</p></body></html>
